<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CampusSlot · Room & Resource Booking</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230e7c7b'/><path d='M28 52l16 16 30-34' fill='none' stroke='white' stroke-width='11' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<style>
:root{
  --ink:#10243a; --muted:#5d6b7a; --paper:#f1f4f3; --card:#fff; --line:#dde3e6;
  --teal:#0e7c7b; --teal-d:#0a5f5e; --teal-l:#dff1f0;
  --amber:#e9a23b; --amber-l:#fdf0d8; --slate:#b9c3cc; --slate-l:#e8edf1;
  --coral:#c8553d; --coral-l:#fbe6e1; --green:#2f8f5b; --green-l:#dcf2e5;
  --r:12px;
  font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.5}
h1,h2,h3{margin:0;line-height:1.2;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #7cc4c2;outline-offset:2px}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* buttons & fields */
.btn{border:1px solid var(--line);background:#fff;padding:9px 16px;border-radius:10px;font-weight:600;transition:background .15s,border-color .15s}
.btn:hover{background:var(--slate-l)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.primary:hover{background:var(--teal-d)}
.btn.danger{color:var(--coral);border-color:#efc3b9}
.btn.danger:hover{background:var(--coral-l)}
.btn.ok{background:var(--green);border-color:var(--green);color:#fff}
.btn.ok:hover{background:#25774b}
.btn.sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
label{display:block;font-weight:600;font-size:13px;margin:0 0 5px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
textarea{resize:vertical;min-height:70px}
.field{margin-bottom:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* login */
#login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.hero{background:var(--ink);color:#e9f1f2;padding:56px 56px;display:flex;flex-direction:column;justify-content:center;gap:28px}
.hero h1{font-size:40px;font-weight:700;max-width:14ch}
.hero p{color:#a9bcc6;max-width:42ch;margin:0}
.mini-tt{display:grid;grid-template-columns:48px repeat(4,1fr);gap:4px;max-width:360px;font-size:12px;color:#8aa3b0}
.mini-tt div{height:26px;border-radius:6px;display:flex;align-items:center}
.mini-tt .t{justify-content:flex-start}
.mini-tt .f{background:#1b3a54}
.mini-tt .a{background:var(--slate)}
.mini-tt .p{background:repeating-linear-gradient(135deg,var(--amber) 0 6px,#f3bf6c 6px 12px)}
.mini-tt .s{background:var(--teal);box-shadow:0 0 0 2px #7cc4c2}
.auth{display:flex;align-items:center;justify-content:center;padding:32px}
.auth-card{width:100%;max-width:380px}
.auth-card h2{font-size:26px;margin-bottom:6px}
.sub{color:var(--muted);margin:0 0 22px}
.demo{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 0;align-items:center;color:var(--muted);font-size:13px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.chip:hover{border-color:var(--teal);color:var(--teal-d)}
.linkbtn{background:none;border:0;color:var(--teal-d);font-weight:600;padding:0;text-decoration:underline}
.err{color:var(--coral);font-size:13px;min-height:20px;margin:6px 0}

/* shell */
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.bar{max-width:1120px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:20px}
.brand{font-weight:800;font-size:18px;display:flex;align-items:center;gap:8px;letter-spacing:-.02em}
.logo{width:28px;height:28px;border-radius:8px;background:var(--teal);display:grid;place-items:center}
nav{display:flex;gap:4px;flex:1;overflow-x:auto}
nav button{border:0;background:none;padding:8px 14px;border-radius:9px;font-weight:600;color:var(--muted);white-space:nowrap;position:relative}
nav button:hover{background:var(--slate-l)}
nav button.on{background:var(--teal-l);color:var(--teal-d)}
.badge{background:var(--coral);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;margin-left:6px;font-weight:700}
.who{display:flex;align-items:center;gap:10px}
.who .nm{font-weight:600;font-size:14px;text-align:right;line-height:1.2}
.who .rl{display:block;font-size:12px;color:var(--muted);font-weight:500}
.bell{position:relative;border:1px solid var(--line);background:#fff;border-radius:10px;width:38px;height:38px;display:grid;place-items:center}
.bell .dot{position:absolute;top:-5px;right:-5px;background:var(--coral);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:0 6px;min-width:18px;text-align:center}
.pop{position:absolute;right:20px;top:58px;width:340px;max-width:calc(100vw - 24px);background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:0 12px 32px rgba(16,36,58,.16);overflow:hidden}
.pop h3{font-size:14px;padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.pop ul{list-style:none;margin:0;padding:0;max-height:340px;overflow:auto}
.pop li{padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px}
.pop li.unread{background:var(--teal-l)}
.pop li time{display:block;color:var(--muted);font-size:12px;margin-top:2px}
main{max-width:1120px;margin:0 auto;padding:26px 20px 80px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.head h2{font-size:26px}
.head p{margin:4px 0 0;color:var(--muted)}

/* resources */
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.tools input{max-width:300px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.rc{display:flex;flex-direction:column;gap:10px}
.rc .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.rc h3{font-size:17px}
.tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--slate-l);color:#3b4d5e;white-space:nowrap}
.tag.Hall{background:#e3e9f9;color:#2d4390}.tag.Room{background:var(--teal-l);color:var(--teal-d)}
.tag.Equipment{background:var(--amber-l);color:#8a5a0c}.tag.Compute{background:#ece3f7;color:#5b3a8c}
.meta{color:var(--muted);font-size:13px;display:flex;gap:14px;flex-wrap:wrap}
.specs{font-size:14px}
.rc details{font-size:13px;color:var(--muted)}
.rc details summary{cursor:pointer;font-weight:600;color:var(--ink)}
.rc .foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:6px}
.busy{font-size:13px;color:var(--muted)}

/* lists */
.list{display:flex;flex-direction:column;gap:12px}
.bk{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}
.bk h3{font-size:16px;margin-bottom:2px}
.bk .when{font-weight:600}
.bk .note{margin-top:8px;padding:8px 12px;background:var(--slate-l);border-radius:8px;font-size:13px}
.bk .note.rej{background:var(--coral-l)}
.pill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;display:inline-block}
.pill.pending{background:var(--amber-l);color:#8a5a0c}.pill.approved{background:var(--green-l);color:#1f6b42}
.pill.rejected{background:var(--coral-l);color:#92341f}.pill.cancelled{background:var(--slate-l);color:#4a5a69}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.empty{text-align:center;padding:44px 20px;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--r);background:#fff}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:22px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat b{display:block;font-size:28px;line-height:1.1}
.stat span{color:var(--muted);font-size:13px}
.stat.hot{border-color:var(--amber);background:var(--amber-l)}
.sec{font-size:17px;margin:26px 0 12px}
.bars{display:flex;flex-direction:column;gap:8px}
.bar-r{display:grid;grid-template-columns:150px 1fr 56px;gap:10px;align-items:center;font-size:13px}
.bar-t{height:10px;background:var(--slate-l);border-radius:6px;overflow:hidden}
.bar-t i{display:block;height:100%;background:var(--teal);border-radius:6px}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;font-size:14px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--slate-l);font-size:13px}
tr:last-child td{border-bottom:0}
.tw{overflow-x:auto;border-radius:var(--r)}

/* modal + slot picker */
.ov{position:fixed;inset:0;background:rgba(16,36,58,.5);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:28px 14px;overflow:auto}
.modal{background:#fff;border-radius:16px;width:100%;max-width:640px;padding:22px;box-shadow:0 24px 60px rgba(16,36,58,.3);animation:rise .18s ease-out}
@keyframes rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.modal{animation:none}}
.mh{display:flex;justify-content:space-between;gap:12px;margin-bottom:14px}
.mh h2{font-size:21px}
.x{border:0;background:var(--slate-l);border-radius:8px;width:34px;height:34px;font-size:18px}
.datebar{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.datebar input{flex:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:10px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-3px;margin-right:5px;border:1px solid var(--line)}
.tt{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tr{display:grid;grid-template-columns:58px 1fr 1fr;border-bottom:1px solid var(--line)}
.tr:last-child{border-bottom:0}
.hr{padding:10px 8px;font-size:13px;color:var(--muted);background:#fafbfb;border-right:1px solid var(--line)}
.cell{border:0;border-right:1px solid var(--line);background:#fff;padding:10px 8px;text-align:left;font-size:13px;min-height:42px;position:relative}
.cell:last-child{border-right:0}
.cell.free:hover{background:var(--teal-l)}
.cell.approved{background:var(--slate);color:#2a3947;cursor:not-allowed}
.cell.pending{background:repeating-linear-gradient(135deg,var(--amber-l) 0 7px,#fbe3b5 7px 14px);color:#7a4f0a;cursor:not-allowed}
.cell.past{background:#f4f6f7;color:#a5b0ba;cursor:not-allowed}
.cell.mine{box-shadow:inset 0 0 0 2px var(--teal)}
.cell.sel{background:var(--teal);color:#fff}
.cell .who2{font-size:11px;opacity:.85;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.summary{margin:14px 0;padding:12px 14px;border-radius:10px;background:var(--slate-l);font-weight:600}
.summary.good{background:var(--teal-l);color:var(--teal-d)}
.summary.bad{background:var(--coral-l);color:#92341f}
.mf{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}

/* toasts */
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:100;max-width:calc(100vw - 32px)}
.toast{background:var(--ink);color:#fff;padding:12px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:14px;max-width:380px;border-left:5px solid var(--teal)}
.toast.bad{border-left-color:var(--coral)}
.toast.warn{border-left-color:var(--amber)}

@media (max-width:820px){
  #login{grid-template-columns:1fr}
  .hero{padding:32px 24px}.hero h1{font-size:30px}
  .bar{flex-wrap:wrap;gap:10px}
  nav{order:3;width:100%;flex:none}
  .who .nm{display:none}
  .bk{grid-template-columns:1fr}.acts{justify-content:flex-start}
  .bar-r{grid-template-columns:110px 1fr 48px}
  .row2{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<section id="login" class="hidden">
  <div class="hero">
    <div class="brand" style="color:#fff"><span class="logo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></span>CampusSlot</div>
    <h1>Book the room. Skip the back-and-forth.</h1>
    <p>See what's free, pick your slot, and get a decision from the admin, with no double-bookings, ever.</p>
    <div class="mini-tt" aria-hidden="true">
      <div class="t">09:00</div><div class="a"></div><div class="a"></div><div class="f"></div><div class="f"></div>
      <div class="t">10:00</div><div class="f"></div><div class="p"></div><div class="p"></div><div class="f"></div>
      <div class="t">11:00</div><div class="f"></div><div class="s"></div><div class="s"></div><div class="f"></div>
    </div>
  </div>
  <div class="auth">
    <div class="auth-card">
      <h2 id="aTitle">Sign in</h2>
      <p class="sub" id="aSub">Use your campus account to continue.</p>
      <div class="field hidden" id="nameF"><label for="lName">Full name</label><input id="lName" autocomplete="name"></div>
      <div class="field"><label for="lUser">Username</label><input id="lUser" autocomplete="username" autocapitalize="none"></div>
      <div class="field"><label for="lPass">Password</label><input id="lPass" type="password" autocomplete="current-password"></div>
      <div class="err" id="lErr" role="alert"></div>
      <button class="btn primary" style="width:100%" id="lGo">Sign in</button>
      <p class="sub" style="margin:14px 0 0;font-size:14px"><span id="swTxt">New here?</span> <button class="linkbtn" id="lSw">Create a student account</button></p>
      <div class="demo" id="demo">Try a demo account:
        <button class="chip" data-u="nouman" data-p="pass123">Student</button>
        <button class="chip" data-u="admin" data-p="admin123">Admin</button>
      </div>
    </div>
  </div>
</section>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <header>
    <div class="bar">
      <div class="brand"><span class="logo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></span>CampusSlot</div>
      <nav id="nav"></nav>
      <div class="who">
        <button class="bell" id="bell" aria-label="Notifications"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span class="dot hidden" id="dot">0</span></button>
        <div class="nm" id="nm"></div>
        <button class="btn sm" id="out">Sign out</button>
      </div>
    </div>
    <div class="pop hidden" id="pop"></div>
  </header>
  <main id="view"></main>
</div>
<div id="modalRoot"></div>
<div id="toasts" aria-live="polite"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hm = m => `${pad(Math.floor(m/60))}:${pad(m%60)}`;
const fdate = s => new Date(s + 'T00:00').toLocaleDateString(undefined, {weekday:'short', day:'numeric', month:'short', year:'numeric'});
const ftime = s => new Date(s.replace(' ', 'T')).toLocaleString(undefined, {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
const TYPES = ['Room','Hall','Equipment','Compute'];
const ICON = {Room:'🪑', Hall:'🏛️', Equipment:'🎛️', Compute:'🖥️'};

const S = { token: localStorage.getItem('cs_token'), user: null, view: 'resources', type: 'All', q: '', unread: 0, pending: 0, mineTab: 'upcoming' };

async function api(path, method = 'GET', body) {
  const r = await fetch('/api' + path, {
    method, headers: {'Content-Type': 'application/json', ...(S.token ? {Authorization: 'Bearer ' + S.token} : {})},
    body: body ? JSON.stringify(body) : undefined
  });
  let d = {}; try { d = await r.json(); } catch (e) {}
  if (r.status === 401 && path !== '/login') { signOut(true); throw new Error('Session expired. Please sign in again.'); }
  if (!r.ok) { const e = new Error(d.error || 'Request failed'); e.status = r.status; e.suggestions = d.suggestions; throw e; }
  return d;
}

function toast(msg, kind = '') {
  const t = document.createElement('div'); t.className = 'toast ' + kind; t.textContent = msg;
  $('#toasts').appendChild(t); setTimeout(() => t.remove(), kind === 'bad' ? 6000 : 4200);
}

/* ---------- auth ---------- */
let registering = false;
function setMode(reg) {
  registering = reg;
  $('#aTitle').textContent = reg ? 'Create account' : 'Sign in';
  $('#aSub').textContent = reg ? 'Student accounts can request bookings right away.' : 'Use your campus account to continue.';
  $('#nameF').classList.toggle('hidden', !reg);
  $('#demo').classList.toggle('hidden', reg);
  $('#lGo').textContent = reg ? 'Create account' : 'Sign in';
  $('#swTxt').textContent = reg ? 'Already registered?' : 'New here?';
  $('#lSw').textContent = reg ? 'Sign in instead' : 'Create a student account';
  $('#lErr').textContent = '';
}
$('#lSw').onclick = () => setMode(!registering);
document.querySelectorAll('#demo .chip').forEach(b => b.onclick = () => { $('#lUser').value = b.dataset.u; $('#lPass').value = b.dataset.p; submitAuth(); });
['lUser','lPass','lName'].forEach(id => $('#'+id).addEventListener('keydown', e => { if (e.key === 'Enter') submitAuth(); }));
$('#lGo').onclick = submitAuth;
async function submitAuth() {
  $('#lErr').textContent = '';
  try {
    const body = {username: $('#lUser').value, password: $('#lPass').value};
    if (registering) body.name = $('#lName').value;
    const d = await api(registering ? '/register' : '/login', 'POST', body);
    S.token = d.token; S.user = d.user; localStorage.setItem('cs_token', d.token);
    S.view = 'resources'; startApp();
  } catch (e) { $('#lErr').textContent = e.message; }
}
function signOut(silent) {
  if (!silent) api('/logout', 'POST').catch(() => {});
  S.token = null; S.user = null; localStorage.removeItem('cs_token');
  clearInterval(S.timer); $('#app').classList.add('hidden'); $('#login').classList.remove('hidden');
  $('#lPass').value = ''; closeModal(); setMode(false);
}
$('#out').onclick = () => signOut();

/* ---------- shell ---------- */
async function boot() {
  if (S.token) { try { S.user = await api('/me'); return startApp(); } catch (e) {} }
  $('#login').classList.remove('hidden');
}
function startApp() {
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  $('#nm').innerHTML = `${esc(S.user.name)}<span class="rl">${S.user.role === 'admin' ? 'Administrator' : 'Student'}</span>`;
  S.lastUnread = null; poll(); clearInterval(S.timer); S.timer = setInterval(poll, 8000);
  go(S.view);
}
function nav() {
  const items = [['resources','Resources']];
  items.push(['mine','My bookings']);
  if (S.user.role === 'admin') { items.push(['approvals','Approvals']); items.push(['history','History log']); }
  $('#nav').innerHTML = items.map(([k, l]) => `<button data-k="${k}" class="${S.view === k ? 'on' : ''}">${l}${k === 'approvals' && S.pending ? `<span class="badge">${S.pending}</span>` : ''}</button>`).join('');
  $('#nav').querySelectorAll('button').forEach(b => b.onclick = () => go(b.dataset.k));
}
function go(v) { S.view = v; nav(); ({resources: viewResources, mine: viewMine, approvals: viewApprovals, history: viewHistory})[v](); window.scrollTo(0, 0); }

async function poll() {
  if (!S.user) return;
  try {
    const n = await api('/notifications');
    if (S.lastUnread !== null && n.unread > S.lastUnread) toast(n.items[0].message, 'warn');
    S.lastUnread = n.unread; S.unread = n.unread; S.notes = n.items;
    $('#dot').textContent = n.unread; $('#dot').classList.toggle('hidden', !n.unread);
    if (S.user.role === 'admin') {
      const p = await api('/admin/bookings?status=pending');
      if (p.length !== S.pending) { S.pending = p.length; nav(); if (S.view === 'approvals' && !document.querySelector('textarea:focus')) viewApprovals(); }
    } else if (S.view === 'mine' && n.unread && !$('#modalRoot').innerHTML) viewMine();
  } catch (e) {}
}
$('#bell').onclick = async e => {
  e.stopPropagation(); const pop = $('#pop');
  if (!pop.classList.contains('hidden')) return pop.classList.add('hidden');
  const items = S.notes || [];
  pop.innerHTML = `<h3>Notifications ${S.unread ? '<button class="linkbtn" id="mark">Mark all read</button>' : ''}</h3><ul>${items.length ? items.map(n => `<li class="${n.is_read ? '' : 'unread'}">${esc(n.message)}<time>${ftime(n.ts)}</time></li>`).join('') : '<li>No notifications yet.</li>'}</ul>`;
  pop.classList.remove('hidden');
  const mk = $('#mark'); if (mk) mk.onclick = async ev => { ev.stopPropagation(); await api('/notifications/read', 'POST'); S.lastUnread = 0; poll(); pop.classList.add('hidden'); };
};
document.addEventListener('click', e => { if (!e.target.closest('#pop')) $('#pop').classList.add('hidden'); });

/* ---------- resources ---------- */
function viewResources() {
  $('#view').innerHTML = `
    <div class="head"><div><h2>Rooms & equipment</h2><p>Pick a resource to see its schedule and book a slot.</p></div>
      ${S.user.role === 'admin' ? '<button class="btn primary" id="addR">+ Add resource</button>' : ''}</div>
    <div class="tools"><input id="q" type="search" placeholder="Search by name, spec or location" value="${esc(S.q)}" aria-label="Search resources">
      <div class="chips">${['All', ...TYPES].map(t => `<button class="chip ${S.type === t ? 'on' : ''}" data-t="${t}">${t}</button>`).join('')}</div></div>
    <div class="grid" id="grid"></div>`;
  $('#q').oninput = e => { S.q = e.target.value; loadResources(); };
  document.querySelectorAll('.chips .chip').forEach(b => b.onclick = () => { S.type = b.dataset.t; document.querySelectorAll('.chips .chip').forEach(x => x.classList.toggle('on', x === b)); loadResources(); });
  if ($('#addR')) $('#addR').onclick = addResourceModal;
  loadResources();
}
async function loadResources() {
  const list = await api(`/resources?type=${encodeURIComponent(S.type)}&q=${encodeURIComponent(S.q)}`);
  S.resources = list;
  $('#grid').innerHTML = list.length ? list.map(r => `
    <article class="card rc">
      <div class="top"><h3>${ICON[r.type] || ''} ${esc(r.name)}</h3><span class="tag ${esc(r.type)}">${esc(r.type)}</span></div>
      <div class="meta"><span>👥 ${r.capacity} ${r.capacity === 1 ? 'unit' : 'people'}</span><span>📍 ${esc(r.location || 'On campus')}</span></div>
      <div class="specs">${esc(r.specs)}</div>
      <details><summary>Booking guidelines</summary><p style="margin:6px 0 0">${esc(r.guidelines || 'No special rules.')}</p></details>
      <div class="foot"><span class="busy">${r.today_count ? `${r.today_count} booking${r.today_count > 1 ? 's' : ''} today` : 'Free today'}</span>
        <button class="btn primary sm" data-id="${r.id}">Check slots</button></div>
    </article>`).join('') : '<div class="empty" style="grid-column:1/-1"><b>No matches</b>Try a different search or clear the filter.</div>';
  $('#grid').querySelectorAll('button[data-id]').forEach(b => b.onclick = () => openBooking(list.find(r => r.id == b.dataset.id)));
}

/* ---------- booking modal ---------- */
let BK = null;
function closeModal() { $('#modalRoot').innerHTML = ''; BK = null; }
function modal(html) {
  $('#modalRoot').innerHTML = `<div class="ov" id="ov"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  $('#ov').addEventListener('mousedown', e => { if (e.target.id === 'ov') closeModal(); });
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function openBooking(res, date) {
  BK = {res, date: date || ymd(new Date()), sched: [], slots: [], a: null, b: null, stage: 0, warn: ''};
  modal(`
    <div class="mh"><div><h2>${ICON[res.type] || ''} ${esc(res.name)}</h2><div class="meta" style="margin-top:4px"><span>👥 ${res.capacity}</span><span>📍 ${esc(res.location || '')}</span></div></div><button class="x" id="cx" aria-label="Close">✕</button></div>
    <div class="datebar"><button class="btn sm" id="dPrev" aria-label="Previous day">‹</button><input type="date" id="dDate" min="${ymd(new Date())}" value="${BK.date}" aria-label="Date"><button class="btn sm" id="dNext" aria-label="Next day">›</button></div>
    <div class="legend"><span><i style="background:#fff"></i>Free</span><span><i style="background:var(--slate)"></i>Booked</span><span><i style="background:repeating-linear-gradient(135deg,var(--amber-l) 0 4px,#fbe3b5 4px 8px)"></i>Awaiting approval</span><span><i style="background:var(--teal)"></i>Your selection</span></div>
    <div class="tt" id="tt"></div>
    <div class="summary" id="sum"></div>
    <div class="field"><label for="br">Repeat</label><select id="br"><option value="1">Does not repeat</option>${[2,3,4,6,8].map(n => `<option value="${n}">Every week for ${n} weeks</option>`).join('')}</select></div>
    <div class="field"><label for="bp">What's it for?</label><textarea id="bp" placeholder="e.g. Group revision for DBMS exam, 6 people"></textarea></div>
    <div class="mf"><button class="btn" id="cc">Cancel</button><button class="btn primary" id="go" disabled>Request booking</button></div>`);
  $('#cx').onclick = $('#cc').onclick = closeModal;
  const setDate = v => { BK.date = v; $('#dDate').value = v; loadSched(); };
  $('#dDate').onchange = e => { if (e.target.value && e.target.value >= ymd(new Date())) setDate(e.target.value); else if (e.target.value) { toast('Pick today or a future date', 'warn'); setDate(ymd(new Date())); } };
  const shift = n => { const d = new Date(BK.date + 'T00:00'); d.setDate(d.getDate() + n); const v = ymd(d); if (v >= ymd(new Date())) setDate(v); };
  $('#dPrev').onclick = () => shift(-1); $('#dNext').onclick = () => shift(1);
  $('#bp').oninput = refreshSummary; $('#br').onchange = refreshSummary; $('#go').onclick = submitBooking;
  loadSched();
}
async function loadSched() {
  BK.a = BK.b = null; BK.stage = 0; BK.warn = ''; BK.suggest = null;
  BK.sched = await api(`/schedule?resource_id=${BK.res.id}&date=${BK.date}`);
  const now = new Date(), today = ymd(now), nowMin = now.getHours() * 60 + now.getMinutes();
  BK.slots = []; for (let m = 480; m < 1200; m += 30) BK.slots.push({m, b: BK.sched.find(x => x.start_min <= m && m < x.end_min), past: BK.date < today || (BK.date === today && m < nowMin)});
  drawSlots();
}
function drawSlots() {
  const lo = BK.a === null ? -1 : Math.min(BK.a, BK.b), hi = BK.a === null ? -1 : Math.max(BK.a, BK.b);
  let h = '';
  for (let hr = 0; hr < 12; hr++) {
    h += `<div class="tr"><div class="hr num">${hm(480 + hr * 60)}</div>`;
    for (let k = 0; k < 2; k++) {
      const i = hr * 2 + k, s = BK.slots[i];
      let cls = 'free', txt = ':' + pad(s.m % 60), tip = 'Free';
      if (s.b) { cls = s.b.status; tip = `${s.b.status === 'approved' ? 'Booked' : 'Awaiting approval'} by ${s.b.user_name}${s.b.purpose ? ': ' + s.b.purpose : ''}`; txt += `<span class="who2">${s.b.mine ? 'You' : esc(s.b.user_name.split(' ')[0])}</span>`; if (s.b.mine) cls += ' mine'; }
      else if (s.past) { cls = 'past'; tip = 'Already passed'; }
      if (i >= lo && i <= hi && !s.b && !s.past) cls = 'sel';
      h += `<button class="cell num ${cls}" data-i="${i}" title="${esc(tip)}" ${s.b || s.past ? 'aria-disabled="true"' : ''}>${txt}</button>`;
    }
    h += '</div>';
  }
  $('#tt').innerHTML = h;
  $('#tt').querySelectorAll('.cell').forEach(c => c.onclick = () => pick(+c.dataset.i));
  refreshSummary();
}
function pick(i) {
  const s = BK.slots[i]; if (s.b) { BK.warn = `That slot is taken (${hm(s.b.start_min)}-${hm(s.b.end_min)}). Choose a free one.`; return drawSlots(); } if (s.past) return;
  BK.warn = ''; BK.suggest = null;
  if (BK.stage !== 1) { BK.a = BK.b = i; BK.stage = 1; }
  else {
    const lo = Math.min(BK.a, i), hi = Math.max(BK.a, i), bad = BK.slots.slice(lo, hi + 1).find(x => x.b || x.past);
    if (bad) { BK.warn = 'That range runs into a booked slot. Pick a stretch of free slots.'; BK.a = BK.b = i; BK.stage = 1; }
    else { BK.a = lo; BK.b = hi; BK.stage = 2; }
  }
  drawSlots();
}
function lastDay(d, n) { const x = new Date(d + 'T00:00'); x.setDate(x.getDate() + 7 * (n - 1)); return ymd(x); }
function refreshSummary() {
  const el = $('#sum'), btn = $('#go'); if (!el) return;
  const purpose = ($('#bp').value || '').trim();
  if (BK.warn) {
    el.className = 'summary bad'; el.textContent = BK.warn;
    if (BK.suggest && BK.suggest.length) {
      const box = document.createElement('div'); box.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap;margin-top:10px';
      BK.suggest.forEach(x => { const b = document.createElement('button'); b.className = 'btn sm primary num'; b.textContent = `${x.start} – ${x.end}`;
        b.onclick = () => { BK.a = (parseInt(x.start) * 60 + +x.start.slice(3) - 480) / 30; BK.b = (parseInt(x.end) * 60 + +x.end.slice(3) - 510) / 30; BK.stage = 2; BK.warn = ''; BK.suggest = null; drawSlots(); };
        box.appendChild(b); });
      el.appendChild(box);
    }
  }
  else if (BK.a === null) { el.className = 'summary'; el.textContent = 'Tap a start slot, then tap an end slot to choose a longer stretch.'; }
  else {
    const s = BK.slots[Math.min(BK.a, BK.b)].m, e = BK.slots[Math.max(BK.a, BK.b)].m + 30;
    el.className = 'summary good'; el.innerHTML = `${fdate(BK.date)}, <span class="num">${hm(s)} – ${hm(e)}</span> (${(e - s) / 60} h)${+$('#br').value > 1 ? ` · repeats weekly until ${fdate(lastDay(BK.date, +$('#br').value))}` : ''} ${BK.stage === 1 ? '<span style="font-weight:500">· tap another slot to extend</span>' : ''}`;
  }
  btn.disabled = BK.a === null || purpose.length < 3;
  btn.textContent = S.user.role === 'admin' ? 'Book now' : 'Request booking';
}
async function submitBooking() {
  const s = BK.slots[Math.min(BK.a, BK.b)].m, e = BK.slots[Math.max(BK.a, BK.b)].m + 30;
  $('#go').disabled = true;
  try {
    const r = await api('/bookings', 'POST', {resource_id: BK.res.id, date: BK.date, start: hm(s), end: hm(e), purpose: $('#bp').value, repeat: +$('#br').value});
    toast((r.count > 1 ? `${r.count} weekly bookings ` : 'Booking ') + (r.status === 'approved' ? 'confirmed.' : 'requested. You will be notified when an admin decides.'));
    closeModal(); if (S.view === 'resources') loadResources(); else go(S.view); poll();
  } catch (err) {
    BK.warn = err.message; toast(err.message, 'bad');
    if (err.status === 409) await loadSched();
    BK.warn = err.message; BK.suggest = err.suggestions || null; drawSlots();
  }
}

function addResourceModal() {
  modal(`<div class="mh"><h2>Add a resource</h2><button class="x" id="cx" aria-label="Close">✕</button></div>
    <div class="field"><label for="rn">Name</label><input id="rn" placeholder="e.g. Seminar Hall B"></div>
    <div class="row2"><div class="field"><label for="rt">Type</label><select id="rt">${TYPES.map(t => `<option>${t}</option>`).join('')}</select></div>
      <div class="field"><label for="rc">Capacity</label><input id="rc" type="number" min="1" value="10"></div></div>
    <div class="field"><label for="rl">Location</label><input id="rl" placeholder="Building, floor"></div>
    <div class="field"><label for="rs">Specs</label><input id="rs" placeholder="Projector, AC, 20 chairs"></div>
    <div class="field"><label for="rg">Guidelines</label><textarea id="rg" placeholder="Rules for anyone booking this resource"></textarea></div>
    <div class="err" id="re"></div>
    <div class="mf"><button class="btn" id="cc">Cancel</button><button class="btn primary" id="rs2">Add resource</button></div>`);
  $('#cx').onclick = $('#cc').onclick = closeModal;
  $('#rs2').onclick = async () => {
    try { await api('/resources', 'POST', {name: $('#rn').value, type: $('#rt').value, capacity: $('#rc').value, location: $('#rl').value, specs: $('#rs').value, guidelines: $('#rg').value});
      closeModal(); toast('Resource added.'); loadResources(); } catch (e) { $('#re').textContent = e.message; }
  };
}

/* ---------- my bookings ---------- */
async function viewMine() {
  const all = await api('/bookings/mine'), today = ymd(new Date());
  const live = b => ['pending', 'approved'].includes(b.status) && b.date >= today;
  const tabs = {upcoming: all.filter(live), past: all.filter(b => !live(b)), all};
  const list = tabs[S.mineTab];
  $('#view').innerHTML = `<div class="head"><div><h2>My bookings</h2><p>Track requests, read admin notes, and cancel if plans change.</p></div><button class="btn primary" id="nb">Book a resource</button></div>
    <div class="chips" style="margin-bottom:16px">${Object.entries(tabs).map(([k, v]) => `<button class="chip ${S.mineTab === k ? 'on' : ''}" data-t="${k}">${k[0].toUpperCase() + k.slice(1)} (${v.length})</button>`).join('')}</div>
    <div class="list">${list.length ? list.map(b => bookingCard(b, 'mine')).join('') : `<div class="empty"><b>${S.mineTab === 'upcoming' ? 'Nothing coming up' : 'Nothing here yet'}</b>Find a room or kit and request a slot.</div>`}</div>`;
  $('#nb').onclick = () => go('resources');
  document.querySelectorAll('.chips .chip').forEach(b => b.onclick = () => { S.mineTab = b.dataset.t; viewMine(); });
  bindCancel();
}
function bookingCard(b, mode) {
  const canCancel = ['pending', 'approved'].includes(b.status);
  return `<article class="card bk"><div>
      <h3>${esc(b.resource_name)} <span class="pill ${b.status}">${b.status}</span></h3>
      <div class="when num">${fdate(b.date)} · ${b.start} – ${b.end}</div>
      ${mode === 'approve' ? `<div class="meta" style="margin-top:2px"><span>Requested by <b>${esc(b.user_name)}</b></span></div>` : ''}
      <div style="color:var(--muted);margin-top:2px">${esc(b.purpose)}</div>
      ${b.admin_note ? `<div class="note ${b.status === 'rejected' ? 'rej' : ''}"><b>Admin note:</b> ${esc(b.admin_note)}</div>` : ''}
      ${mode === 'approve' && b.status === 'pending' ? `<div class="field" style="margin:12px 0 0"><label for="n${b.id}">Note to requester (required to reject)</label><textarea id="n${b.id}" style="min-height:52px" placeholder="e.g. Approved, collect the key from the front desk"></textarea></div>` : ''}
    </div>
    <div class="acts">${mode === 'approve' && b.status === 'pending' ? `<button class="btn ok sm" data-d="approved" data-id="${b.id}">Approve</button><button class="btn danger sm" data-d="rejected" data-id="${b.id}">Reject</button>` : ''}
      ${mode === 'mine' && canCancel ? `<button class="btn danger sm" data-c="${b.id}">Cancel booking</button>` : ''}</div></article>`;
}
function bindCancel() {
  document.querySelectorAll('[data-c]').forEach(b => b.onclick = async () => {
    if (!confirm('Cancel this booking? The slot will become free for others.')) return;
    try { await api(`/bookings/${b.dataset.c}/cancel`, 'POST'); toast('Booking cancelled.'); viewMine(); } catch (e) { toast(e.message, 'bad'); }
  });
}

/* ---------- admin ---------- */
async function viewApprovals() {
  const [pending, recent, st] = await Promise.all([api('/admin/bookings?status=pending'), api('/admin/bookings'), api('/admin/stats')]);
  S.pending = pending.length; nav();
  const decided = recent.filter(b => b.status !== 'pending').slice(0, 6), max = Math.max(1, ...st.usage.map(u => u.hours));
  $('#view').innerHTML = `<div class="head"><div><h2>Approvals</h2><p>Review requests and leave a short note for the requester.</p></div></div>
    <div class="stats"><div class="stat ${pending.length ? 'hot' : ''}"><b>${pending.length}</b><span>Waiting for review</span></div><div class="stat"><b>${st.counts.approved || 0}</b><span>Approved</span></div>
      <div class="stat"><b>${st.counts.rejected || 0}</b><span>Rejected</span></div><div class="stat"><b>${st.resources}</b><span>Resources listed</span></div></div>
    <h3 class="sec" style="margin-top:0">Pending requests</h3>
    <div class="list">${pending.length ? pending.map(b => bookingCard(b, 'approve')).join('') : '<div class="empty"><b>All caught up</b>New requests will appear here.</div>'}</div>
    ${decided.length ? `<h3 class="sec">Recent decisions</h3><div class="list">${decided.map(b => bookingCard(b, 'view')).join('')}</div>` : ''}
    <h3 class="sec">Approved hours per resource</h3><div class="card bars">${st.usage.map(u => `<div class="bar-r"><span>${esc(u.name)}</span><div class="bar-t"><i style="width:${u.hours / max * 100}%"></i></div><span class="num">${u.hours} h</span></div>`).join('')}</div>`;
  document.querySelectorAll('[data-d]').forEach(btn => btn.onclick = async () => {
    const id = btn.dataset.id, note = $('#n' + id).value;
    if (btn.dataset.d === 'rejected' && note.trim().length < 3) { toast('Add a short note explaining the rejection.', 'warn'); return $('#n' + id).focus(); }
    try { await api(`/admin/bookings/${id}/decision`, 'POST', {decision: btn.dataset.d, note}); toast(btn.dataset.d === 'approved' ? 'Request approved.' : 'Request rejected.'); viewApprovals(); }
    catch (e) { toast(e.message, 'bad'); viewApprovals(); }
  });
}
async function viewHistory() {
  const rows = await api('/admin/history');
  $('#view').innerHTML = `<div class="head"><div><h2>History log</h2><p>Every request, decision and cancellation, newest first.</p></div><button class="btn" id="csv">Export CSV</button></div>
    <div class="tw"><table><thead><tr><th>When</th><th>Who</th><th>Action</th><th>Resource</th><th>Details</th></tr></thead><tbody>
    ${rows.map(r => `<tr><td class="num" style="white-space:nowrap">${ftime(r.ts)}</td><td>${esc(r.actor)}</td><td><span class="pill ${/approved|booked/i.test(r.action) ? 'approved' : /reject/i.test(r.action) ? 'rejected' : /cancel|expire/i.test(r.action) ? 'cancelled' : 'pending'}">${esc(r.action)}</span></td><td>${esc(r.resource_name || '')}</td><td>${esc(r.note)}</td></tr>`).join('') || '<tr><td colspan="5">No activity yet.</td></tr>'}
    </tbody></table></div>`;
  $('#csv').onclick = () => {
    const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
    const csv = [['When', 'Who', 'Action', 'Resource', 'Details'], ...rows.map(r => [r.ts, r.actor, r.action, r.resource_name, r.note])].map(r => r.map(q).join(',')).join('\r\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], {type: 'text/csv'}));
    a.download = 'booking-history-' + ymd(new Date()) + '.csv'; a.click(); URL.revokeObjectURL(a.href); toast('History exported.');
  };
}

boot();
</script>
</body>
</html>
